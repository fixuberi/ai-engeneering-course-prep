[project]
name = "ml-mini-task"
version = "0.1.0"
description = "Train a scikit-learn classifier and serve it with FastAPI (/predict, /similarity)."
authors = [
    { name = "Yakiv Zhavoronkov (personal)", email = "comeclarity007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
